services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carbtrack}
      POSTGRES_USER: ${POSTGRES_USER:-carbtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carbtrack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carbtrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: ../backend
    restart: on-failure
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-carbtrack}
      POSTGRES_USER: ${POSTGRES_USER:-carbtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carbtrack}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../backend:/app
    ports:
      # 8000 est déjà pris par GestionCarburantPro sur l'hôte → on expose CarbTrack sur 8001
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
