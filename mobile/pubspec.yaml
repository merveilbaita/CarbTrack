name: carbtrack
description: "CarbTrack — suivi GPS continu des chauffeurs (anti-vol carburant)."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Réseau
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Stockage
  flutter_secure_storage: ^9.2.2   # config serveur + token chauffeur
  sqflite: ^2.4.1                  # buffer offline des positions
  path: ^1.9.0
  path_provider: ^2.1.5

  # Géoloc + service de premier plan (suivi 24/7 en arrière-plan)
  geolocator: ^13.0.2
  flutter_foreground_task: ^8.17.0
  flutter_local_notifications: ^19.5.0
  permission_handler: ^11.3.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1

  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
