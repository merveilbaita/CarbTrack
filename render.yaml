# Blueprint Render — déploie le backend CarbTrack (Django/Daphne) depuis le Dockerfile.
# La base de données est Neon (PostGIS) : renseignez DATABASE_URL dans le dashboard Render.
services:
  - type: web
    name: carbtrack
    runtime: docker
    plan: free
    region: virginia               # us-east, co-localisé avec la base Neon (us-east-1)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/ping
    # La commande de démarrage est dans backend/render-start.sh (CMD du Dockerfile),
    # pour éviter les problèmes de guillemets dans le YAML.
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true        # Render génère une clé secrète
      - key: DATABASE_URL
        sync: false                # ⚠️ à coller : la chaîne de connexion Neon (sslmode=require)
      - key: DJANGO_SSL_REDIRECT
        value: "1"
      # REDIS_URL non défini → Channels utilise la couche en mémoire (un seul process).
